name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: native postinstall binaries (ffmpeg-static,
      # whatsapp-rust-bridge) are optional; tests/bridge handle their absence.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck, lint & format (strict)
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Coverage gate (admission threshold)
        run: npm run test:coverage

      - name: Production build
        run: npm run build
