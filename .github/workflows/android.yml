name: Android (Nova)

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build Nova APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Licences Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Keystore debug STABLE entre les runs (cache) : les APK successifs
      # s'installent l'un par-dessus l'autre sans désinstallation.
      - name: Cache du keystore debug
        uses: actions/cache@v4
        with:
          path: android/debug.keystore
          key: nova-debug-keystore-v1

      - name: Keystore debug si absent
        run: |
          [ -f debug.keystore ] || keytool -genkeypair -v \
            -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Nova Debug,O=Nova,C=CM"

      - name: Build APK (debug)
        run: |
          # Le shell par défaut des steps est `bash -e -o pipefail` : sans
          # `set +e`, l'échec de gradle tuerait l'étape AVANT l'écriture du
          # résumé de diagnostic (les logs GitHub sont inaccessibles depuis
          # certains réseaux — c'est notre seul canal d'erreur).
          set +e
          gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "## Échec du build Gradle — 80 dernières lignes"
              echo '```'
              tail -n 80 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Upload de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
