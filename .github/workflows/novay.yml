name: NoVaY (Flutter)

on:
  push:
    paths:
      - "novay/**"
      - ".github/workflows/novay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NoVaY APK
    runs-on: ubuntu-24.04  # epingle : ubuntu-latest passe a Ubuntu 26 le 19/10/2026
    defaults:
      run:
        working-directory: novay
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Pas de SDK Flutter au sandbox : c'est LA compilation de reference.
      - name: Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versions
        run: flutter --version

      - name: Licences Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Keystore debug STABLE entre les runs (cache) : les APK successifs
      # (signes avec la cle debug en release V0) s'installent l'un par-dessus
      # l'autre sans desinstallation.
      - name: Cache du keystore debug
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: novay-debug-keystore-v1

      - name: Keystore debug si absent
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Nova Debug,O=Nova,C=CM"

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # L'APK "fat" embarque armeabi-v7a (32 bits, Android 7+ requis par le
      # owner) + arm64-v8a + x86_64 : un seul fichier a installer.
      - name: Build APK (release, 32+64 bits)
        run: |
          # Le shell par defaut des steps est `bash -e -o pipefail` : sans
          # `set +e`, l'echec de gradle tuerait l'etape AVANT l'ecriture du
          # resume de diagnostic (les logs GitHub sont inaccessibles depuis
          # certains reseaux - c'est notre seul canal d'erreur).
          set +e
          flutter build apk --release 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Annotations ::error - SEUL canal d'erreur lisible via l'API
            # depuis cette session.
            grep -E "^e: |error: |FAILURE|What went wrong|Caused by|OutOfMemory|FAILED|Exception" build.log | head -n 6 | while IFS= read -r line; do
              echo "::error::${line:0:240}"
            done
            tail -n 40 build.log | grep -v "^> Task" | tail -n 4 | while IFS= read -r line; do
              echo "::error::${line:0:240}"
            done
            exit "$status"
          fi

      - name: Upload de l'APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: novay-release-apk
          path: novay/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Log de build en artifact, meme en echec - plan B si les annotations
      # sont insuffisantes.
      - name: Upload du log de build (toujours)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: novay-build-log
          path: novay/build.log
          if-no-files-found: ignore
