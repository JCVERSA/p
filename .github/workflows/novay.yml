name: NoVaY (Kotlin)

on:
  push:
    paths:
      - "novay/**"
      - ".github/workflows/novay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NoVaY APK
    runs-on: ubuntu-24.04  # epingle : ubuntu-latest passe a Ubuntu 26 le 19/10/2026
    defaults:
      run:
        working-directory: novay
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Licences Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Keystore STABLE entre les runs (cache) : l'APK release V0 est signe
      # avec la cle debug, les APK successifs s'installent l'un par-dessus
      # l'autre sans desinstallation.
      - name: Cache du keystore debug
        uses: actions/cache@v6
        with:
          path: novay/debug.keystore
          key: novay-debug-keystore-v1

      - name: Keystore debug si absent
        run: |
          [ -f debug.keystore ] || keytool -genkeypair -v \
            -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=NoVaY Debug,O=NoVaY,C=CM"

      # Tests unitaires des parseurs (fixtures portees du bot) AVANT le
      # build : un parseur casse ne doit jamais produire d'APK.
      - name: Tests unitaires
        run: |
          set +e
          gradle :app:testDebugUnitTest --no-daemon 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              grep -E "^e: |error: |What went wrong|Caused by|Could not|Execution failed|unresolved" test.log | head -n 4
              # Noms et messages des tests en echec (rapports XML)
              grep -lE '<failure|<error' app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | while read -r xf; do
                grep -oE '<failure message="[^"]{0,200}|<error message="[^"]{0,200}' "$xf" | head -n 4
                grep -oE '<testcase name="[^"]*"' "$xf" | head -n 2
              done
              grep -vE "^> |^[[:space:]]*$|^Download" test.log | tail -n 3
            } | while IFS= read -r line; do
              echo "::error::${line:0:240}"
            done
            exit "$status"
          fi
          # Garde-fou : zero rapport de test = tests non compiles (source
          # set ?) - un silence n'est pas un succes.
          reports=$(ls app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | wc -l)
          if [ "$reports" -eq 0 ]; then
            echo "::error::Aucun test execute - le source set src/test/kotlin n'est pas pris en compte"
            exit 1
          fi
          # Compte de tests visible en annotation a chaque run (preuve API).
          tests=$(grep -ho 'tests="[0-9]*"' app/build/test-results/testDebugUnitTest/*.xml | grep -o '[0-9]*' | awk '{s+=$1} END {print s}')
          echo "::notice::${tests} tests unitaires passes"

      # APK "fat" : armeabi-v7a (32 bits, Android 7+ - exigence owner) +
      # arm64-v8a + x86_64 dans un seul fichier a installer.
      - name: Build APK (release)
        run: |
          # Le shell par defaut des steps est `bash -e -o pipefail` : sans
          # `set +e`, l'echec de gradle tuerait l'etape AVANT l'ecriture du
          # resume de diagnostic (les logs GitHub sont inaccessibles depuis
          # certains reseaux - c'est notre seul canal d'erreur).
          set +e
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Annotations ::error - SEUL canal d'erreur lisible via l'API
            # depuis cette session.
            grep -E "^e: |error: |FAILURE|What went wrong|Caused by|OutOfMemory|FAILED" build.log | head -n 6 | while IFS= read -r line; do
              echo "::error::${line:0:240}"
            done
            tail -n 40 build.log | grep -v "^> Task" | tail -n 4 | while IFS= read -r line; do
              echo "::error::${line:0:240}"
            done
            exit "$status"
          fi

      - name: Upload de l'APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: novay-release-apk
          path: novay/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Log de build en artifact, meme en echec - plan B si les annotations
      # sont insuffisantes.
      - name: Upload du log de build (toujours)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: novay-build-log
          path: novay/build.log
          if-no-files-found: ignore

      - name: Upload du log de tests (toujours)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: novay-test-log
          path: novay/test.log
          if-no-files-found: ignore

  # Sonde reseau manuelle (workflow_dispatch ou push [probe]) : le runner a
  # internet ouvert - le sandbox n'a pas acces aux sites.
  probe:
    name: Sonde anime-sama
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[probe]'))
    runs-on: ubuntu-24.04
    steps:
      - name: Sonde
        run: |
          say() { echo "::notice::${1:0:240}"; }
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          O="https://anime-sama.to"

          # TOUS les panneaux de naruto et solo-leveling (paires nom:sous-chemin)
          for slug in naruto solo-leveling; do
            curl -sS -A "$UA" --max-time 20 "$O/catalogue/$slug/" -o /tmp/a.html 2>/dev/null
            pairs=$(grep -oE 'panneauAnime\("[^"]+", *"[^"]+"\)' /tmp/a.html | sed 's/panneauAnime(//;s/"//g;s/, */:/' | tr '\n' '|')
            say "$slug total => $(echo "$pairs" | grep -o '|' | wc -l) panneaux"
            echo "$pairs" | tr '|' '\n' | grep -v '^$' | paste -sd '|' - | fold -w 210 | while IFS= read -r chunk; do
              say "$slug panneaux => $chunk"
            done
            # selecteur de langue dans la page
            say "$slug selector => $(grep -oE '<(select|button|label|a|div) [^>]{0,90}(langue|vf|vostfr)[^>]{0,90}' /tmp/a.html | grep -viE 'panneau|saison' | head -n 3 | tr '\n\r' '||')"
          done

          # Les pages de saison VF existent-elles directement ?
          for u in "catalogue/naruto/saison1/vf/" "catalogue/solo-leveling/saison1/vf/"; do
            c=$(curl -sS -o /tmp/v.html --max-time 15 -A "$UA" -w '%{http_code} %{size_download}' "$O/$u" 2>/dev/null)
            say "vf $u => $c, eps arrays => $(grep -cE 'eps[0-9]+ *=' /tmp/v.html || true), jeton => $(grep -c epsJeton /tmp/v.html || true)"
          done

          # Page d'accueil : structure pour l'onglet Catalogue (sections
          # recents / populaires) — dump compact via notices. set +e : un
          # grep sans match ne doit jamais couter la sonde (pipefail).
          set +e
          curl -sS -A "$UA" --max-time 20 "$O/" -o /tmp/home.html 2>/dev/null
          tr -d '\n\r' < /tmp/home.html > /tmp/home1.html
          say "home size => $(wc -c < /tmp/home.html), cartes catalogue => $(grep -coE 'href=\"[^\"]*/catalogue/[a-z0-9-]+/?\"' /tmp/home1.html)"
          # Histogramme des classes (top 20) — structure des sections/cartes.
          grep -oE 'class=\"[a-z0-9 _-]{2,50}\"' /tmp/home1.html | sort | uniq -c | sort -rn | head -n 20 | while IFS= read -r l; do
            say "home class => $l"
          done
          # Occurrences de top/populaire & compagnie avec contexte.
          grep -oE '.{60}(top|populair|dernier|nouveaut)[a-zéèê]*.{60}' /tmp/home1.html | head -n 6 | sed 's/"/~/g' | while IFS= read -r l; do
            say "home motctx => $l"
          done
          # Contexte des 3 premiers liens catalogue (carte + section).
          grep -oE '.{260}/catalogue/[a-z0-9-]+/?.{200}' /tmp/home1.html | head -n 3 | sed 's/"/~/g' | while IFS= read -r c; do
            echo "$c" | fold -w 200 | while IFS= read -r chunk; do say "home card => $chunk"; done
          done
          # Squelette textuel (sans balises) : de quoi parle la page ?
          sed 's/<script[\s\S]*?<\/script>//g' /tmp/home1.html | sed 's/<[^>]*>/~/g' | sed 's/~~*/~/g' | head -c 1600 | fold -w 200 | while IFS= read -r chunk; do
            say "home texte => $chunk"
          done

          # Page catalogue complete (liste de tous les animes).
          curl -sS -A "$UA" --max-time 20 "$O/catalogue/" -o /tmp/cat.html 2>/dev/null
          tr -d '\n\r' < /tmp/cat.html > /tmp/cat1.html
          say "catalogue size => $(wc -c < /tmp/cat.html), animes => $(grep -oE '/catalogue/[a-z0-9-]+/?' /tmp/cat1.html | sort -u | wc -l)"
          grep -oE '.{200}/catalogue/[a-z0-9-]+/?.{200}' /tmp/cat1.html | head -n 2 | sed 's/"/~/g' | while IFS= read -r c; do
            echo "$c" | fold -w 200 | while IFS= read -r chunk; do say "cat card => $chunk"; done
          done
