name: NoVaY (Kotlin)

on:
  push:
    paths:
      - "novay/**"
      - ".github/workflows/novay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NoVaY APK
    runs-on: ubuntu-24.04  # epingle : ubuntu-latest passe a Ubuntu 26 le 19/10/2026
    defaults:
      run:
        working-directory: novay
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Licences Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Keystore STABLE entre les runs (cache) : l'APK release V0 est signe
      # avec la cle debug, les APK successifs s'installent l'un par-dessus
      # l'autre sans desinstallation.
      - name: Cache du keystore debug
        uses: actions/cache@v6
        with:
          path: novay/debug.keystore
          key: novay-debug-keystore-v1

      - name: Keystore debug si absent
        run: |
          [ -f debug.keystore ] || keytool -genkeypair -v \
            -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=NoVaY Debug,O=NoVaY,C=CM"

      # Tests unitaires des parseurs (fixtures portees du bot) AVANT le
      # build : un parseur casse ne doit jamais produire d'APK.
      - name: Tests unitaires
        id: tests
        # V2.9.7 : garde-fou anti-test-bloque. Reference : 122 s sur le run
        # vert 44893714621. Le run 44899458840 a du etre annule par le owner
        # apres 13 min (etape bloquee a 784 s) : un test se pend. Au lieu de
        # tourner indefiniment, l'etape echoue au bout de 12 min.
        timeout-minutes: 12
        run: |
          set +e
          gradle :app:testDebugUnitTest --no-daemon 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              grep -E "^e: |error: |What went wrong|Caused by|Could not|Execution failed|unresolved" test.log | head -n 4
              # Noms et messages des tests en echec (rapports XML)
              grep -lE '<failure|<error' app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | while read -r xf; do
                grep -oE '<failure message="[^"]{0,200}|<error message="[^"]{0,200}' "$xf" | head -n 4
                grep -oE '<testcase name="[^"]*"' "$xf" | head -n 2
              done
              grep -vE "^> |^[[:space:]]*$|^Download" test.log | tail -n 3
            } | while IFS= read -r line; do
              echo "::error::${line:0:240}"
            done
            exit "$status"
          fi
          # Garde-fou : zero rapport de test = tests non compiles (source
          # set ?) - un silence n'est pas un succes.
          reports=$(ls app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | wc -l)
          if [ "$reports" -eq 0 ]; then
            echo "::error::Aucun test execute - le source set src/test/kotlin n'est pas pris en compte"
            exit 1
          fi
          # Compte de tests visible en annotation a chaque run (preuve API).
          tests=$(grep -ho 'tests="[0-9]*"' app/build/test-results/testDebugUnitTest/*.xml | grep -o '[0-9]*' | awk '{s+=$1} END {print s}')
          echo "::notice::${tests} tests unitaires passes"

      # V2.9.7 : diagnostic post-tests, execute MEME sur timeout/echec.
      # Chaque test est logge STARTED/PASSED/FAILED (config Gradle). Si un
      # test se pend, le dernier STARTED sans verdict designe le coupable ;
      # on le publie en ANNOTATION (canal lisible sans telecharger les
      # artefacts).
      - name: Diagnostic des tests (toujours)
        if: always()
        run: |
          if [ ! -s test.log ]; then
            echo "::notice::test.log vide ou absent - rien a diagnostiquer"
            exit 0
          fi
          started=$(grep -cE "> .*STARTED" test.log || true)
          passed=$(grep -cE "> .*PASSED" test.log || true)
          failed=$(grep -cE "> .*FAILED" test.log || true)
          echo "::notice::Tests demarres=$started passes=$passed echoues=$failed"
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            exit 0
          fi
          echo "::error::Etape Tests unitaires : ${{ steps.tests.outcome }} - derniers tests demarres ci-dessous (un STARTED sans PASSED/FAILED = test bloque)"
          grep -E "> .*STARTED" test.log | tail -n 4 | while IFS= read -r ligne; do
            echo "::error::DERNIER TEST : ${ligne:0:220}"
          done
          # Messages d echec des rapports XML (tests termines avant un eventuel blocage)
          grep -lE '<failure|<error' app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | while read -r xf; do
            awk '{
              if (match($0, /<testcase name="[^"]*"/)) { tc = substr($0, RSTART + 16, RLENGTH - 17) }
              if ($0 ~ /<failure|<error/) { print tc }
            }' "$xf" | head -n 2 | while IFS= read -r nom; do
              echo "::error::TEST EN ECHEC : ${nom:0:160}"
            done
            grep -oE '<failure message="[^"]{0,170}|<error message="[^"]{0,170}' "$xf" | head -n 2 | while IFS= read -r ligne; do
              echo "::error::MESSAGE : ${ligne:0:220}"
            done
          done
          grep -E "^e: |error: |Execution failed" test.log | head -n 3 | while IFS= read -r ligne; do
            echo "::error::${ligne:0:240}"
          done

      # Audit Q-02 : lint statique Android - NON BLOQUANT dans un premier
      # temps : le rapport part en artefact pour analyse, on ne casse pas
      # une livraison pour un avertissement.
      - name: Lint Android (non bloquant)
        run: |
          set +e
          gradle :app:lintDebug --no-daemon 2>&1 | tee lint.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::lint a signale des problemes - rapport dans l artefact novay-lint-report"
            grep -E "Error:|Warning:" lint.log | head -n 8 | while IFS= read -r line; do
              echo "::warning::${line:0:240}"
            done
          fi

      - name: Upload rapport lint (toujours)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: novay-lint-report
          path: app/build/reports/
          if-no-files-found: ignore

      # Owner (15/11, apres la premiere release) : livraison UNIQUE =
      # APK UNIVERSEL (armeabi-v7a + arm64-v8a) - il s installe sur tous
      # les telephones Android 7+, y compris le 32 bits du owner. Le poids
      # (~103 Mo) est maitrise par la compression 7z (~39 Mo). Plus de
      # build 32 bits separe : un seul build, plus rapide.
      - name: Build APK universel (arm32+arm64, release)
        run: |
          # Le shell par defaut des steps est `bash -e -o pipefail` : sans
          # `set +e`, l'echec de gradle tuerait l'etape AVANT l'ecriture du
          # resume de diagnostic (les logs GitHub sont inaccessibles depuis
          # certains reseaux - c'est notre seul canal d'erreur).
          set +e
          gradle :app:assembleRelease -PnovayAbi=armeabi-v7a,arm64-v8a --no-daemon 2>&1 | tee build-universal.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Annotations ::error - SEUL canal d'erreur lisible via l'API
            # depuis cette session.
            grep -E "^e: |error: |FAILURE|What went wrong|Caused by|OutOfMemory|FAILED" build-universal.log | head -n 6 | while IFS= read -r line; do
              echo "::error::${line:0:240}"
            done
            tail -n 40 build-universal.log | grep -v "^> Task" | tail -n 4 | while IFS= read -r line; do
              echo "::error::${line:0:240}"
            done
            exit "$status"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/novay-universal-release.apk

      # Connexion owner limitee : l'APK est AUSSI livre compresse en
      # 7z (LZMA2 niveau 9 - le code natif se compresse d'environ moitie).
      # p7zip-full est preinstalle sur ubuntu-24.04 (binaire 7z ; 7zz en
      # repli si le runner change).
      - name: Compression 7z des APK
        run: |
          set -e
          SEVENZ="$(command -v 7zz || command -v 7z)"
          if [ -z "$SEVENZ" ]; then
            echo "::error::p7zip introuvable sur le runner (attendu preinstalle)"
            exit 1
          fi
          cd dist
          for abi in universal; do
            "$SEVENZ" a -t7z -m0=lzma2 -mx=9 -md=128m -ms=on \
              "novay-${abi}-release.7z" "novay-${abi}-release.apk" > /dev/null
          done

      # Garde-fou + tailles visibles : l'APK d'une ABI ne doit contenir
      # AUCUNE native d'une autre ABI (sinon le filtre a echoue).
      # V2.9.6 : libVLC retire — l APK n embarque plus de natives lourdes.
      # Si des natives reapparaissent (future dependance), elles doivent
      # rester dans les ABI cibles ; sinon, information seule.
      - name: Verification ABI et tailles livrees
        run: |
          set -e
          cd dist
          apk=novay-universal-release.apk
          natives=$(unzip -l "$apk" | grep -c "lib/" || true)
          if [ "${natives:-0}" -eq 0 ]; then
            echo "::notice::$apk : aucune lib native (moteur VLC retire en V2.9.6) - APK identique pour toutes les architectures"
          else
            fuite=$(unzip -l "$apk" | grep "lib/" | grep -cvE "lib/(armeabi-v7a|arm64-v8a)/" || true)
            if [ "${fuite:-0}" -ne 0 ]; then
              echo "::error::$apk embarque $fuite natives hors arm32/arm64 - filtre ABI en echec"
              exit 1
            fi
          fi
          mo() { awk -v b="$(stat -c%s "$1")" 'BEGIN {printf "%.2f", b/1048576}'; }
          pct() { awk -v a="$1" -v b="$2" 'BEGIN {printf "%.0f", (a-b)*100/a}'; }
          au=$(mo novay-universal-release.apk); zu=$(mo novay-universal-release.7z)
          echo "::notice::universel (tous telephones Android 7+) : APK ${au} Mo | 7z ${zu} Mo (-$(pct "$au" "$zu") %)"

      - name: Upload APK universel
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: novay-release-universal-apk
          path: novay/dist/novay-universal-release.apk
          if-no-files-found: error

      - name: Upload 7z universel
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: novay-release-universal-7z
          path: novay/dist/novay-universal-release.7z
          if-no-files-found: error

      # Logs de build en artifact, meme en echec - plan B si les annotations
      # sont insuffisantes.
      - name: Upload des logs de build (toujours)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: novay-build-log
          path: novay/build-universal.log
          if-no-files-found: ignore

      - name: Upload du log de tests (toujours)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: novay-test-log
          path: novay/test.log
          if-no-files-found: ignore

  # Sonde reseau manuelle (workflow_dispatch ou push [probe]) : le runner a
  # internet ouvert - le sandbox n'a pas acces aux sites.
  probe:
    name: Sonde anime-sama
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[probe]'))
    runs-on: ubuntu-24.04
    steps:
      - name: Preparation
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          O="https://anime-sama.to"
          curl -sS -A "$UA" --max-time 25 "$O/" -o /tmp/home.html 2>/dev/null
          tr -d '\n\r' < /tmp/home.html > /tmp/home1.html

      - name: Sections visibles
        run: |
          set +e
          say() { echo "::notice::${1:0:240}"; }
          perl -0777 -pe 's/<script.*?<\/script>//gs; s/<style.*?<\/style>//gs; s/<!--.*?-->//gs; s/<svg.*?<\/svg>//gs' /tmp/home1.html \
            | sed 's/<[^>]*>/\n/g' | sed 's/&nbsp;/ /g; s/&amp;/\&/g; s/&#039;/'"'"'/g; s/&quot;/"/g' \
            | sed 's/^[ \t]*//; s/[ \t]*$//' | grep -E '^[A-ZÀ-ÿ].{2,60}$' | awk '!seen[$0]++' | head -n 40 \
            | while IFS= read -r t; do say "sec => $t"; done

      - name: Temps des cartes
        run: |
          set +e
          say() { echo "::notice::${1:0:240}"; }
          grep -oE '<span class="as-carte-temps"[^>]*>[^<]{1,40}' /tmp/home1.html | head -n 5 | while IFS= read -r t; do say "temps => $t"; done
          grep -oE 'class="as-carte-titre"[^>]*>[^<]{1,60}' /tmp/home1.html | head -n 4 | while IFS= read -r t; do say "titre carte => $t"; done
          grep -oE '<a class="as-carte-lien" href="[^"]+"' /tmp/home1.html | head -n 6 | while IFS= read -r t; do say "lien carte => $t"; done
