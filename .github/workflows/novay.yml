name: NoVaY (Kotlin)

on:
  push:
    paths:
      - "novay/**"
      - ".github/workflows/novay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NoVaY APK
    runs-on: ubuntu-24.04  # epingle : ubuntu-latest passe a Ubuntu 26 le 19/10/2026
    defaults:
      run:
        working-directory: novay
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Licences Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Keystore STABLE entre les runs (cache) : l'APK release V0 est signe
      # avec la cle debug, les APK successifs s'installent l'un par-dessus
      # l'autre sans desinstallation.
      - name: Cache du keystore debug
        uses: actions/cache@v6
        with:
          path: novay/debug.keystore
          key: novay-debug-keystore-v1

      - name: Keystore debug si absent
        run: |
          [ -f debug.keystore ] || keytool -genkeypair -v \
            -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=NoVaY Debug,O=NoVaY,C=CM"

      # Tests unitaires des parseurs (fixtures portees du bot) AVANT le
      # build : un parseur casse ne doit jamais produire d'APK.
      - name: Tests unitaires
        run: |
          set +e
          gradle :app:testDebugUnitTest --no-daemon 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              grep -E "^e: |error: |What went wrong|Caused by|Could not|Execution failed|unresolved|cache problems" test.log | head -n 6
              grep -vE "^> |^[[:space:]]*$|^Download" test.log | tail -n 4
            } | while IFS= read -r line; do
              echo "::error::${line:0:240}"
            done
            exit "$status"
          fi
          # Garde-fou : zero rapport de test = tests non compiles (source
          # set ?) - un silence n'est pas un succes.
          reports=$(ls app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | wc -l)
          if [ "$reports" -eq 0 ]; then
            echo "::error::Aucun test execute - le source set src/test/kotlin n'est pas pris en compte"
            exit 1
          fi
          # Compte de tests visible en annotation a chaque run (preuve API).
          tests=$(grep -ho 'tests="[0-9]*"' app/build/test-results/testDebugUnitTest/*.xml | grep -o '[0-9]*' | awk '{s+=$1} END {print s}')
          echo "::notice::${tests} tests unitaires passes"

      # APK "fat" : armeabi-v7a (32 bits, Android 7+ - exigence owner) +
      # arm64-v8a + x86_64 dans un seul fichier a installer.
      - name: Build APK (release)
        run: |
          # Le shell par defaut des steps est `bash -e -o pipefail` : sans
          # `set +e`, l'echec de gradle tuerait l'etape AVANT l'ecriture du
          # resume de diagnostic (les logs GitHub sont inaccessibles depuis
          # certains reseaux - c'est notre seul canal d'erreur).
          set +e
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Annotations ::error - SEUL canal d'erreur lisible via l'API
            # depuis cette session.
            grep -E "^e: |error: |FAILURE|What went wrong|Caused by|OutOfMemory|FAILED" build.log | head -n 6 | while IFS= read -r line; do
              echo "::error::${line:0:240}"
            done
            tail -n 40 build.log | grep -v "^> Task" | tail -n 4 | while IFS= read -r line; do
              echo "::error::${line:0:240}"
            done
            exit "$status"
          fi

      - name: Upload de l'APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: novay-release-apk
          path: novay/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Log de build en artifact, meme en echec - plan B si les annotations
      # sont insuffisantes.
      - name: Upload du log de build (toujours)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: novay-build-log
          path: novay/build.log
          if-no-files-found: ignore

      - name: Upload du log de tests (toujours)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: novay-test-log
          path: novay/test.log
          if-no-files-found: ignore

  # Sonde reseau manuelle : le site est-il vivant, redirige-t-il, vers
  # quel domaine ? Lancee via workflow_dispatch uniquement (le runner a
  # internet ouvert - le sandbox n'a pas acces au site).
  probe:
    name: Sonde voir-anime
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[probe]'))
    runs-on: ubuntu-24.04
    steps:
      - name: Probe voir-anime.to + domaines alternatifs
        run: |
          say() { echo "::notice::${1:0:240}"; }

          # Le domaine existe-t-il ? (NS/SOA via plusieurs resolveurs)
          for ns in 8.8.8.8 1.1.1.1 9.9.9.9; do
            a=$(dig +short @$ns voir-anime.to A 2>&1 | tr '\n' ' ')
            say "A @$ns => ${a:-VIDE}"
          done
          say "NS => $(dig +short voir-anime.to NS 2>&1 | tr '\n' ' ')"
          say "SOA => $(dig +short voir-anime.to SOA 2>&1 | head -n 1)"

          # E2E anime-sama.si : recherche -> saisons -> episodes.js -> player
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          ORIGIN="https://anime-sama.si"

          # 1. Recherche (POST fetch.php)
          curl -sS -A "$UA" --max-time 20 -d "query=naruto" "$ORIGIN/template-php/defaut/fetch.php" -o /tmp/search.html 2>/dev/null
          say "search => $(wc -c < /tmp/search.html) o, asn-result => $(grep -c 'asn-search-result' /tmp/search.html || true)"
          say "sample href => $(grep -oE 'href="[^"]+"' /tmp/search.html | head -n 3 | tr '\n' ' ')"

          # 2. Page anime -> panneauAnime
          url=$(grep -oE 'href="[^"]*catalogue[^"]*"' /tmp/search.html | head -n 1 | sed 's/href="//;s/"$//')
          case "$url" in http*) ;; /*) url="$ORIGIN$url";; *) url="$ORIGIN/$url";; esac
          say "anime url => $url"
          curl -sS -A "$UA" --max-time 20 "$url" -o /tmp/anime.html 2>/dev/null
          say "anime page => $(wc -c < /tmp/anime.html) o, panneauAnime => $(grep -c 'panneauAnime' /tmp/anime.html || true)"
          say "panneaux => $(grep -oE 'panneauAnime\([^)]*\)' /tmp/anime.html | head -n 6 | tr '\n' ' | ')"

          # 3. episodes.js de la 1re saison
          sub=$(grep -oE 'panneauAnime\([^)]*\)' /tmp/anime.html | head -n 1 | grep -oE '"[^"]*"' | tail -n 1 | tr -d '"')
          say "subPath => $sub"
          curl -sS -A "$UA" --max-time 20 "$url/$sub/episodes.js" -o /tmp/eps.js 2>/dev/null
          say "episodes.js => $(wc -c < /tmp/eps.js) o, tableaux eps => $(grep -cE 'eps[0-9]+ *=' /tmp/eps.js || true)"
          say "eps contenu => $(head -c 400 /tmp/eps.js | tr '\n' ' ')"

          # 4. Player du 1er episode (liste 1) -> resolvable ?
          purl=$(grep -oE "'[^']*'|\"[^\"]*\"" /tmp/eps.js | tr -d "'\"" | grep '^http' | head -n 1)
          say "player 1 => $purl"
          if [ -n "$purl" ]; then
            pc=$(curl -sS -A "$UA" --max-time 15 -o /tmp/player.html -w '%{http_code}' "$purl" 2>/dev/null | tail -n 1)
            say "player http => $pc, $(wc -c < /tmp/player.html) o"
            say "player m3u8 => $(grep -oE 'https?://[^\"'\'' ]*m3u8[^\"'\'' ]*' /tmp/player.html | head -n 2 | tr '\n' ' ')"
            say "player src => $(grep -oE 'player\.src[^;]{0,80}' /tmp/player.html | head -n 1)"
          fi
