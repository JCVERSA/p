name: novay
description: "NoVaY — animes VF/VOSTFR en streaming et téléchargement, direct depuis le téléphone."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Réseau avec en-têtes personnalisés (UA/Referer) — le nerf du scraping.
  dio: ^5.7.0
  # Parsing HTML (catalogues) — équivalent des parseurs regex du bot.
  html: ^0.15.5
  # Préférences locales (catalogue par défaut, préférences VF/VOSTFR…).
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
