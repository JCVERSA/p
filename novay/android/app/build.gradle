plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "dot.jcversa.novay"
    // NoVaY : Android 7+ ET 32 bits (armeabi-v7a) exigé par le owner —
    // minSdk 24 = Android 7.0. L'APK "fat" embarque toutes les ABI.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    defaultConfig {
        applicationId = "dot.jcversa.novay"
        minSdk = 24
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // V0 : signé avec la clé debug (installation manuelle). Une clé
            // dédiée viendra si l'appli est distribuée plus largement.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

